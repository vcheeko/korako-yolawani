name: orchestra-registry

on:
  pull_request:
    paths:
      - 'orchestra/**'
      - 'docs/ORCHESTRA_CAPABILITY_REGISTRY.md'
      - '.github/workflows/orchestra-registry.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node version
        run: node --version
      - name: Verify Orchestra capability routing
        run: node orchestra/v0.1/selftest.mjs
