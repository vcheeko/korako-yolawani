title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Share an idea that could improve Korako's public product, evidence or community surface. Keep private-core and security-sensitive details out of public Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem, limitation or opportunity does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed idea
      description: What would you change or add?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or validation
      description: What evidence would show that this idea is useful or correct?
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-boundary check
      options:
        - label: I have not included credentials, personal data, private-core implementation details or sensitive vulnerability information.
          required: true
